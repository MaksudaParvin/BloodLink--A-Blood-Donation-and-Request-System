<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>
</head>

<body>

    <h1>Welcome back</h1>

    <p>Sign in to your BloodLink account</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Sign In
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{% url 'accounts:register' %}">
            Create Account
        </a>
    </p>

</body>

</html>
